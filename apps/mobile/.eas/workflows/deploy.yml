# Deploy to production
#
# Runs only after GitHub verifies and deploys the matching backend commit.
# Builds and submits to App Store Connect, or sends an over-the-air update when there are no native changes.
# Learn more: https://docs.expo.dev/eas/workflows/examples/deploy-to-production/
#
# Created by EAS CLI v22.0.0

name: Deploy to production

concurrency:
  cancel_in_progress: true
  group: production-mobile

on:
  workflow_dispatch: {}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production
  # Compare against the newest build testers can install. Looking up any build
  # with the current fingerprint can select an older build after a native revert.
  get_latest_ios_build:
    name: Get latest production iOS build
    type: get-build
    params:
      platform: ios
      distribution: store
      channel: production
      profile: production
      wait_for_in_progress: true
  build_ios:
    name: Build iOS
    needs:
      - fingerprint
      - get_latest_ios_build
    if: ${{ !needs.get_latest_ios_build.outputs.build_id || needs.get_latest_ios_build.outputs.fingerprint_hash != needs.fingerprint.outputs.ios_fingerprint_hash }}
    type: build
    params:
      platform: ios
      profile: production
  submit_ios_build:
    name: Submit iOS Build
    needs:
      - build_ios
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
  publish_ios_update:
    name: Publish iOS update
    needs:
      - fingerprint
      - get_latest_ios_build
    if: ${{ needs.get_latest_ios_build.outputs.build_id && needs.get_latest_ios_build.outputs.fingerprint_hash == needs.fingerprint.outputs.ios_fingerprint_hash }}
    type: update
    environment: production
    params:
      branch: production
      platform: ios
